<svg viewBox="0 0 1320 1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151"/>
    </marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b8790a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="32" font-size="20" font-weight="700" fill="#111827">Final Integration Capstone — Production-Grade Concurrency Architecture</text>
  <text x="30" y="52" font-size="12" fill="#6b7280">ICU Bedside ECG Telemetry &amp; Nurse Call System — tasks · ISR · cores · IPC · guards · watchdogs · SOH</text>

  <!-- Legend -->
  <g transform="translate(870,14)">
    <rect x="0" y="0" width="18" height="14" rx="2" fill="#d9f5e6" stroke="#1f9d63" stroke-width="1.5"/>
    <text x="24" y="11" font-size="10.5" fill="#111827">Implemented in current firmware</text>
    <rect x="0" y="22" width="18" height="14" rx="2" fill="#fff6db" stroke="#b8790a" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="24" y="33" font-size="10.5" fill="#111827">Recommended addition (guard / watchdog)</text>
  </g>

  <!-- ===================== CORE 1 CONTAINER ===================== -->
  <rect x="30" y="80" width="800" height="780" rx="12" fill="#f3fbf7" stroke="#2f9e6a" stroke-width="2"/>
  <text x="50" y="106" font-size="14" font-weight="700" fill="#0b3d24">CORE 1 — Real-Time IPC Pipeline (deterministic, no network I/O)</text>

  <!-- Task A -->
  <rect x="60" y="130" width="220" height="72" rx="6" fill="#d9f5e6" stroke="#1f9d63" stroke-width="1.5"/>
  <text x="72" y="152" font-size="12.5" font-weight="700" fill="#0b3d24">TASK A — Producer</text>
  <text x="72" y="168" font-size="10.5" fill="#0b3d24">Telemetry Sampler · Prio 8</text>
  <text x="72" y="182" font-size="10.5" fill="#0b3d24">20 Hz (50 ms) · hb_a, WCET_a</text>
  <text x="72" y="196" font-size="9.5" fill="#3f7a5f">sets EV_BIT_DATA_PRODUCED</text>

  <!-- Queue -->
  <rect x="60" y="232" width="220" height="52" rx="6" fill="#ece6fb" stroke="#6b4fd1" stroke-width="1.5"/>
  <text x="72" y="253" font-size="11.5" font-weight="700" fill="#2c1a5e">data_q — depth 10</text>
  <text x="72" y="268" font-size="10" fill="#2c1a5e">typed FIFO, xQueueSend 10ms timeout → drop</text>

  <!-- Task B -->
  <rect x="60" y="314" width="220" height="72" rx="6" fill="#d9f5e6" stroke="#1f9d63" stroke-width="1.5"/>
  <text x="72" y="336" font-size="12.5" font-weight="700" fill="#0b3d24">TASK B — Consumer</text>
  <text x="72" y="352" font-size="10.5" fill="#0b3d24">Arrhythmia Processor · Prio 8</text>
  <text x="72" y="366" font-size="10.5" fill="#0b3d24">100 ms max wait · hb_b, WCET_b</text>
  <text x="72" y="380" font-size="9.5" fill="#3f7a5f">sets EV_BIT_DATA_PROCESSED</text>

  <!-- Guard G1 (recommended) -->
  <rect x="330" y="314" width="230" height="72" rx="6" fill="#fff6db" stroke="#b8790a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="342" y="333" font-size="12" font-weight="700" fill="#6b4f09">G1 — portMUX spinlock</text>
  <text x="342" y="348" font-size="10" fill="#6b4f09">Guards last_sample / last_verdict</text>
  <text x="342" y="362" font-size="10" fill="#6b4f09">(shared, cross-core, currently</text>
  <text x="342" y="375" font-size="10" fill="#6b4f09">unguarded volatile writes) [ADD]</text>

  <!-- Event group -->
  <rect x="60" y="418" width="220" height="58" rx="6" fill="#ece6fb" stroke="#6b4fd1" stroke-width="1.5"/>
  <text x="72" y="440" font-size="11.5" font-weight="700" fill="#2c1a5e">evt_group</text>
  <text x="72" y="455" font-size="10" fill="#2c1a5e">AND-wait: PRODUCED &amp; PROCESSED</text>
  <text x="72" y="468" font-size="9.5" fill="#5b4a99">clear-on-exit, portMAX_DELAY</text>

  <!-- Task C -->
  <rect x="60" y="510" width="220" height="72" rx="6" fill="#d9f5e6" stroke="#1f9d63" stroke-width="1.5"/>
  <text x="72" y="532" font-size="12.5" font-weight="700" fill="#0b3d24">TASK C — Coordinator</text>
  <text x="72" y="548" font-size="10.5" fill="#0b3d24">Rendezvous · Prio 9</text>
  <text x="72" y="562" font-size="10.5" fill="#0b3d24">clears both bits · hb_c, WCET_c</text>
  <text x="72" y="576" font-size="9.5" fill="#3f7a5f">xTaskNotifyGive(responder)</text>

  <!-- Task D -->
  <rect x="330" y="510" width="230" height="72" rx="6" fill="#d9f5e6" stroke="#1f9d63" stroke-width="1.5"/>
  <text x="342" y="532" font-size="12.5" font-weight="700" fill="#0b3d24">TASK D — Responder</text>
  <text x="342" y="548" font-size="10.5" fill="#0b3d24">Alarm Dispatch Actuator · Prio 12</text>
  <text x="342" y="562" font-size="10.5" fill="#0b3d24">ulTaskNotifyTake · hb_d, WCET_d</text>
  <text x="342" y="576" font-size="9.5" fill="#3f7a5f">reads last_verdict/last_sample</text>

  <!-- ISR -->
  <rect x="60" y="612" width="220" height="62" rx="6" fill="#fbe4df" stroke="#d16b4f" stroke-width="1.5"/>
  <text x="72" y="634" font-size="12.5" font-weight="700" fill="#5e2c1a">GPIO18 ISR — Nurse Call</text>
  <text x="72" y="649" font-size="10" fill="#5e2c1a">IRAM_ATTR, NEGEDGE, 200ms debounce</text>
  <text x="72" y="663" font-size="9.5" fill="#8a4a34">vTaskNotifyGiveFromISR → Task D</text>

  <!-- Watchdog bar (recommended) -->
  <rect x="60" y="700" width="500" height="66" rx="6" fill="#fff6db" stroke="#b8790a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="72" y="722" font-size="12" font-weight="700" fill="#6b4f09">Task Watchdog Timer (TWDT) [ADD]</text>
  <text x="72" y="737" font-size="10" fill="#6b4f09">esp_task_wdt_add(A,B,C,D) at init; each task calls</text>
  <text x="72" y="751" font-size="10" fill="#6b4f09">esp_task_wdt_reset() once per cycle — catches a stalled/deadlocked task</text>

  <!-- IDLE1 watchdog (already implemented by default in ESP-IDF) -->
  <rect x="600" y="700" width="200" height="66" rx="6" fill="#d9f5e6" stroke="#1f9d63" stroke-width="1.5"/>
  <text x="612" y="722" font-size="11.5" font-weight="700" fill="#0b3d24">IDLE1 Watchdog</text>
  <text x="612" y="737" font-size="9.5" fill="#0b3d24">ESP-IDF default</text>
  <text x="612" y="750" font-size="9.5" fill="#0b3d24">Core 1 starvation guard</text>

  <!-- SOH plane -->
  <rect x="600" y="418" width="200" height="250" rx="8" fill="#eef1f2" stroke="#6b7280" stroke-width="1.5"/>
  <text x="614" y="440" font-size="12.5" font-weight="700" fill="#1f2937">SOH Telemetry Plane</text>
  <text x="614" y="458" font-size="10" fill="#1f2937">hb_a..d</text>
  <text x="614" y="472" font-size="9.5" fill="#4b5563">(must grow monotonically)</text>
  <text x="614" y="490" font-size="10" fill="#1f2937">WCET_max per task (µs)</text>
  <text x="614" y="508" font-size="10" fill="#1f2937">data_q depth / evt_group bits</text>
  <text x="614" y="526" font-size="10" fill="#1f2937">dropped_samples</text>
  <text x="614" y="544" font-size="10" fill="#1f2937">arrhythmia_alerts</text>
  <text x="614" y="562" font-size="10" fill="#1f2937">manual_nurse_calls</text>
  <text x="614" y="586" font-size="9.5" fill="#6b7280">Read-only export to Core 0 —</text>
  <text x="614" y="600" font-size="9.5" fill="#6b7280">this is the fault/health surface</text>
  <text x="614" y="614" font-size="9.5" fill="#6b7280">an operator or dashboard checks.</text>

  <!-- ===================== CORE 0 CONTAINER ===================== -->
  <rect x="880" y="80" width="410" height="780" rx="12" fill="#eef4fc" stroke="#3f7fd1" stroke-width="2"/>
  <text x="900" y="106" font-size="14" font-weight="700" fill="#173a6b">CORE 0 — Observability &amp; Supervision Plane</text>

  <rect x="910" y="140" width="350" height="120" rx="6" fill="#dbe8fb" stroke="#3f7fd1" stroke-width="1.5"/>
  <text x="922" y="162" font-size="12.5" font-weight="700" fill="#173a6b">Monitor Task</text>
  <text x="922" y="178" font-size="10.5" fill="#173a6b">Serial (1 Hz) or HTTP dashboard</text>
  <text x="922" y="192" font-size="10.5" fill="#173a6b">Prio 4–5 · non-real-time, Wi-Fi/HTTP</text>
  <text x="922" y="210" font-size="10" fill="#173a6b">Reads SOH plane every cycle</text>
  <text x="922" y="224" font-size="10" fill="#b8790a">Acquires G1 before reading</text>
  <text x="922" y="238" font-size="10" fill="#b8790a">last_sample/last_verdict [ADD]</text>
  <text x="922" y="252" font-size="9.5" fill="#4c6ea8">never blocks Core 1 scheduling</text>

  <rect x="910" y="280" width="350" height="60" rx="6" fill="#d9f5e6" stroke="#1f9d63" stroke-width="1.5"/>
  <text x="922" y="302" font-size="11.5" font-weight="700" fill="#0b3d24">IDLE0 Watchdog</text>
  <text x="922" y="317" font-size="9.5" fill="#0b3d24">ESP-IDF default · Core 0 starvation guard</text>

  <rect x="910" y="362" width="350" height="150" rx="6" fill="#fafafa" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="922" y="384" font-size="12" font-weight="700" fill="#1f2937">Why this split matters (rubric Q1)</text>
  <text x="922" y="402" font-size="10" fill="#374151">Wi-Fi/HTTP work is unbounded-latency —</text>
  <text x="922" y="416" font-size="10" fill="#374151">pinning it to Core 0 keeps Core 1's 50ms</text>
  <text x="922" y="430" font-size="10" fill="#374151">sampling deadline and rendezvous timing</text>
  <text x="922" y="444" font-size="10" fill="#374151">immune to network jitter. Reading shared</text>
  <text x="922" y="458" font-size="10" fill="#374151">state across cores is why G1 exists: without</text>
  <text x="922" y="472" font-size="10" fill="#374151">it, the monitor can read a torn/half-written</text>
  <text x="922" y="486" font-size="10" fill="#374151">last_sample mid-update from Task B.</text>

  <rect x="910" y="530" width="350" height="130" rx="6" fill="#fafafa" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="922" y="552" font-size="12" font-weight="700" fill="#1f2937">Fault posture summary</text>
  <text x="922" y="570" font-size="9.7" fill="#374151">• Queue full → sample dropped, counted</text>
  <text x="922" y="586" font-size="9.7" fill="#374151">• Task starvation → caught by TWDT [ADD]</text>
  <text x="922" y="602" font-size="9.7" fill="#374151">• Cross-core race → prevented by G1 [ADD]</text>
  <text x="922" y="618" font-size="9.7" fill="#374151">• Idle-task lockup → caught by IDLE0/1 WDT</text>
  <text x="922" y="634" font-size="9.7" fill="#374151">• Manual escalation → nurse-call ISR, always</text>
  <text x="922" y="648" font-size="9.7" fill="#374151">  live regardless of pipeline state</text>

  <!-- ===================== ARROWS ===================== -->
  <!-- A -> Queue -->
  <path d="M170,202 L170,232" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <!-- Queue -> B -->
  <path d="M170,284 L170,314" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <!-- B -> Event group -->
  <path d="M170,386 L170,418" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <!-- A -> Event group (direct set of PRODUCED, curved like source diagram) -->
  <path d="M280,150 C420,150 420,430 280,447" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="200" font-size="9" fill="#4b5563">Task A also sets PRODUCED bit directly</text>
  <!-- B -> G1 (write) -->
  <path d="M280,350 L330,350" stroke="#b8790a" stroke-width="1.6" fill="none" marker-end="url(#arrowAmber)"/>
  <!-- Event group -> C -->
  <path d="M170,476 L170,510" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <!-- C -> D -->
  <path d="M280,546 L330,546" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="284" y="540" font-size="9" fill="#4b5563">direct notify</text>
  <!-- G1 -> D (guarded read) -->
  <path d="M420,386 L420,510" stroke="#b8790a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowAmber)"/>
  <text x="428" y="450" font-size="9" fill="#8a5c0a">guarded read</text>
  <!-- ISR -> D -->
  <path d="M280,635 C310,635 300,582 330,552" stroke="#d16b4f" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="230" y="600" font-size="9" fill="#8a4a34">direct notify from ISR</text>
  <!-- C,D -> watchdog bar -->
  <path d="M170,582 L170,700" stroke="#b8790a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowAmber)"/>
  <path d="M445,582 L445,700" stroke="#b8790a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowAmber)"/>
  <text x="180" y="695" font-size="9" fill="#8a5c0a">reset() each cycle — all of A, B, C, D feed the TWDT</text>

  <!-- Tasks -> SOH -->
  <path d="M280,548 C450,548 480,500 600,500" stroke="#6b7280" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M280,360 C500,360 500,450 600,450" stroke="#6b7280" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M170,232 C500,150 560,150 600,470" stroke="#6b7280" stroke-width="1.1" fill="none" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- SOH -> Monitor (cross-core) -->
  <path d="M800,500 C845,500 845,200 910,200" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="808" y="300" font-size="9.5" fill="#374151" transform="rotate(90,808,300)">crosses core boundary</text>

  <!-- G1 -> Monitor -->
  <path d="M560,340 C700,340 780,240 910,222" stroke="#b8790a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowAmber)"/>

  <!-- footer rubric checklist -->
  <rect x="30" y="880" width="1260" height="100" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="48" y="902" font-size="12.5" font-weight="700" fill="#111827">Rubric coverage</text>
  <text x="48" y="922" font-size="10.5" fill="#1f2937">Tasks ✓ (A–D, priorities, cores)   ISR ✓ (GPIO18, debounced, IRAM_ATTR)   Cores ✓ (0 vs 1 split, rationale above)</text>
  <text x="48" y="940" font-size="10.5" fill="#1f2937">IPC ✓ (queue depth-10, event-group AND-wait, direct task notification)   SOH ✓ (heartbeats + WCET + fault counters, exported read-only to Core 0)</text>
  <text x="48" y="958" font-size="10.5" fill="#b8790a">Guards + Watchdogs — flagged as [ADD] above: current code has no spinlock around last_sample/last_verdict and no esp_task_wdt registration. Add both for full production-grade credit.</text>
</svg>